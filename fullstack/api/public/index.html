<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokeStock — Kauppa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAEFE9; --paper-2: #DEE6DE; --ink: #1B231F; --ink-soft: #4B564F;
    --line: #C7D1C6; --card: #F7FAF6; --gold: #B8862B; --gold-deep: #8F6A20;
    --teal: #2F6E62; --brick: #8B3A3A; --brick-bg: #F3E4E0; --radius: 3px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171B18; --paper-2: #1F251F; --ink: #E8EDE7; --ink-soft: #A7B3A9;
      --line: #333D33; --card: #1D231E; --gold: #D8A94A; --gold-deep: #B8862B;
      --teal: #4E9385; --brick: #C97B7B; --brick-bg: #2E1E1E;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171B18; --paper-2: #1F251F; --ink: #E8EDE7; --ink-soft: #A7B3A9;
    --line: #333D33; --card: #1D231E; --gold: #D8A94A; --gold-deep: #B8862B;
    --teal: #4E9385; --brick: #C97B7B; --brick-bg: #2E1E1E;
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  .hero { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 6px; }
  .brand .mark { font-family: 'Fraunces', serif; font-weight: 700; font-size: 30px; letter-spacing: -0.01em; }
  .brand .mark em { font-style: normal; color: var(--gold-deep); }
  .tag { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 18px 0 0; }
  .search { flex: 1; min-width: 180px; font-family: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); }
  .search:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
  .btn { font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius); border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; }
  .btn:hover { background: var(--gold-deep); border-color: var(--gold-deep); }
  .btn:disabled { opacity: 0.5; cursor: default; background: var(--ink-soft); border-color: var(--ink-soft); }
  .btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--ink); background: var(--card); }
  .btn.small { padding: 7px 12px; font-size: 12.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 16px; padding-left: 2px; }
  .tab { font-size: 12.5px; font-weight: 600; padding: 7px 13px 8px; cursor: pointer; user-select: none; background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--line); border-bottom: none; border-radius: 6px 6px 0 0; position: relative; top: 1px; }
  .tab[data-active="true"] { background: var(--card); color: var(--ink); border-color: var(--ink); border-bottom: 1px solid var(--card); }
  .tab .n { color: var(--ink-soft); font-weight: 500; margin-left: 5px; }
  .tab[data-active="true"] .n { color: var(--gold-deep); }
  .panel { background: var(--card); border: 1px solid var(--ink); border-top: none; border-radius: 0 6px 6px 6px; min-height: 120px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--line); }
  .cardtile { background: var(--card); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .cardtile .nimi { font-weight: 600; font-size: 14px; }
  .cardtile .numero { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
  .cardtile .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--line); width: fit-content; }
  .cardtile .hinta { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 17px; margin-top: 2px; }
  .cardtile .pending { font-size: 11.5px; color: var(--gold-deep); font-weight: 600; }
  .loading, .error-state, .empty { padding: 46px 20px; text-align: center; color: var(--ink-soft); font-size: 14px; }
  .error-state { color: var(--brick); }
  .overlay { position: fixed; inset: 0; background: rgba(20,24,20,0.45); display: none; align-items: flex-start; justify-content: center; padding: 8vh 16px; z-index: 20; overflow-y:auto; }
  .overlay[data-open="true"] { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--ink); border-radius: 6px; width: 100%; max-width: 420px; padding: 24px; }
  .modal h2 { font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 2px; font-weight: 600; }
  .modal .sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; font-family: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); color: var(--ink); }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
  .form-error { font-size: 12.5px; color: var(--brick); margin-top: 10px; display: none; }
  .form-ok { font-size: 13px; color: var(--teal); margin-top: 10px; display: none; }
  .modal-actions { display:flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  footer { margin-top: 30px; font-size: 11.5px; color: var(--ink-soft); text-align: center; }
  @media (max-width: 640px) {
    .wrap { padding: 20px 14px 60px; }
    .grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="brand"><span class="mark">Poke<em>Stock</em></span></div>
    <div class="tag">Myynnissä olevat Pokémon-kortit — tee tarjous kortista, myyjä ottaa yhteyttä jos tarjous hyväksytään</div>
  </div>

  <div class="toolbar">
    <input class="search" id="searchInput" type="text" placeholder="Hae kortin nimellä…">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <div class="grid" id="grid" style="display:none;"></div>
    <div class="loading" id="loadingState">Ladataan kortteja…</div>
    <div class="empty" id="emptyState" style="display:none;">Ei kortteja tällä haulla.</div>
    <div class="error-state" id="errorState" style="display:none;"></div>
  </div>

  <footer>PokeStock — kortit ja hinnat viitteellisiä, lopullinen hinta sovitaan myyjän kanssa.</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Tee tarjous</h2>
    <p class="sub" id="modalSub"></p>
    <form id="offerForm">
      <div class="field"><label for="f_nimi">Nimesi</label><input id="f_nimi" required placeholder="Etu- ja sukunimi"></div>
      <div class="field"><label for="f_email">Sähköpostisi</label><input id="f_email" type="email" required placeholder="nimi@esimerkki.fi"></div>
      <div class="field"><label for="f_hinta">Tarjouksesi (€)</label><input id="f_hinta" type="number" step="0.01" min="0" required placeholder="0.00"></div>
      <div class="field"><label for="f_viesti">Viesti (valinnainen)</label><textarea id="f_viesti" maxlength="500" placeholder="Esim. nouto/toimitustoive"></textarea></div>
      <div class="form-error" id="formError"></div>
      <div class="form-ok" id="formOk"></div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="cancelBtn">Peruuta</button>
        <button type="submit" class="btn" id="submitBtn">Lähetä tarjous</button>
      </div>
    </form>
  </div>
</div>

<script>
const API = '/api/cards';
let allCards = [];
let activeCategory = 'Kaikki';
let searchTerm = '';
let searchDebounce = null;
let valittuKorttiId = null;

const CATS = ['Kaikki','Kiilto','Tähti','Trainer','Erikois','Vanhat','Pienet sarjat','Bulk'];
const eur = n => Number(n).toLocaleString('fi-FI', {style:'currency', currency:'EUR'});
const escapeHtml = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

async function apiRequest(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(body?.virhe || `Virhe (${res.status})`);
  return body;
}

async function loadCards() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('grid').style.display = 'none';
  try {
    allCards = await apiRequest(`${API}?myyty=false`);
    renderAll();
  } catch (err) {
    document.getElementById('loadingState').style.display = 'none';
    const es = document.getElementById('errorState');
    es.style.display = 'block';
    es.textContent = 'Korttien lataus epäonnistui: ' + err.message;
  }
}

function renderAll() { renderTabs(); renderGrid(); }

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CATS.forEach(cat => {
    const count = cat === 'Kaikki' ? allCards.length : allCards.filter(c => c.kategoria === cat).length;
    const el = document.createElement('div');
    el.className = 'tab';
    el.setAttribute('data-active', String(cat === activeCategory));
    el.innerHTML = `${cat}<span class="n">${count}</span>`;
    el.addEventListener('click', () => { activeCategory = cat; renderAll(); });
    tabsEl.appendChild(el);
  });
}

function getFiltered() {
  let list = allCards.slice();
  if (activeCategory !== 'Kaikki') list = list.filter(c => c.kategoria === activeCategory);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    list = list.filter(c => c.nimi.toLowerCase().includes(q) || (c.numero||'').toLowerCase().includes(q));
  }
  list.sort((a,b) => b.arvo - a.arvo);
  return list;
}

function renderGrid() {
  const list = getFiltered();
  const grid = document.getElementById('grid');
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';

  if (!list.length) {
    grid.style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    return;
  }
  grid.style.display = 'grid';
  document.getElementById('emptyState').style.display = 'none';

  grid.innerHTML = list.map(c => `
    <div class="cardtile">
      <span class="chip">${escapeHtml(c.kategoria)}</span>
      <div class="nimi">${escapeHtml(c.nimi)}</div>
      <div class="numero">${escapeHtml(c.numero || '')} · ${escapeHtml(c.kunto || '')}</div>
      <div class="hinta">${eur(c.arvo)}</div>
      ${c.tarjottu
        ? `<div class="pending">Tarjous käsittelyssä</div><button class="btn secondary small" disabled>Tarjous jätetty</button>`
        : `<button class="btn small" data-open-offer="${c._id}" data-nimi="${escapeHtml(c.nimi)}" data-numero="${escapeHtml(c.numero||'')}">Tee tarjous</button>`
      }
    </div>`).join('');

  grid.querySelectorAll('[data-open-offer]').forEach(btn => {
    btn.addEventListener('click', () => avaaTarjousModal(
      btn.getAttribute('data-open-offer'),
      btn.getAttribute('data-nimi'),
      btn.getAttribute('data-numero')
    ));
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(renderGrid, 120);
});

const overlay = document.getElementById('overlay');

function avaaTarjousModal(id, nimi, numero) {
  valittuKorttiId = id;
  document.getElementById('modalTitle').textContent = 'Tee tarjous';
  document.getElementById('modalSub').textContent = `${nimi} ${numero}`.trim();
  document.getElementById('offerForm').reset();
  document.getElementById('formError').style.display = 'none';
  document.getElementById('formOk').style.display = 'none';
  document.getElementById('offerForm').style.display = 'block';
  overlay.setAttribute('data-open', 'true');
}

document.getElementById('cancelBtn').addEventListener('click', () => overlay.setAttribute('data-open','false'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.setAttribute('data-open','false'); });

document.getElementById('offerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('formError');
  const okEl = document.getElementById('formOk');
  errEl.style.display = 'none';
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;

  const payload = {
    ostajan_nimi: document.getElementById('f_nimi').value.trim(),
    ostajan_sahkoposti: document.getElementById('f_email').value.trim(),
    tarjottu_hinta: parseFloat(document.getElementById('f_hinta').value) || 0,
    ostajan_viesti: document.getElementById('f_viesti').value.trim(),
  };

  try {
    await apiRequest(`${API}/${valittuKorttiId}/tarjous`, { method: 'POST', body: JSON.stringify(payload) });
    document.getElementById('offerForm').style.display = 'none';
    okEl.textContent = 'Tarjous lähetetty! Myyjä ottaa sinuun yhteyttä sähköpostitse jos tarjous hyväksytään.';
    okEl.style.display = 'block';
    await loadCards();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
});

loadCards();
</script>
</body>
</html>
