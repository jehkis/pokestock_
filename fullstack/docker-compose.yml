services:
  mongo:
    image: mongo:7
    container_name: pokestock-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: pokestock-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/pokestock
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
